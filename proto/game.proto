syntax = "proto3";

package bg;

// A board in the fixed frame, the same for both colours:
//   0..23  points; white moves from 0 towards 23, black from 23 towards 0
//   24, 25 white bar, black bar
//   26, 27 white's and black's borne-off stones
// White stones are positive, black stones negative.
message Position {
  repeated sint32 cell = 1 [packed = true];  // exactly 28 values
}

// A model's prediction for a position, in the fixed frame. The outcomes
// exclude each other: their probabilities sum to 1.
message Prediction {
  float white_single = 1;  // white wins 1 point
  float white_gammon = 2;  // white wins 2 or 3 points (backgammons included)
  float black_single = 3;
  float black_gammon = 4;
}

// One turn: the roll and the position the mover produced with it.
message Turn {
  // 10 * high die + low die, e.g. 63, 55.
  int32 dice = 1;

  // The position after the mover played this roll.
  Position after = 2;

  // The mover's prediction for `after`; absent if the mover has no model.
  Prediction prediction = 3;
}

// One complete game. Who played, and with which settings, is recorded with
// the match the game belongs to, not here.
message Game {
  bool white_first = 1;

  // +1..+3 if white won, -1..-3 if black won.
  int32 final_score = 2;

  // The position before the first turn.
  Position start = 3;

  // The position before turn i is turns[i - 1].after (start for turn 0).
  repeated Turn turns = 4;
}
