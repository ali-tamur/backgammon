[project]
name = "backgammon"
version = "0.1.0"
description = "Backgammon engine (C++) with neural networks trained by self-play (Python)"
# onnxruntime 1.20.1 has no wheels for 3.14; the venv uses the system 3.12.
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "onnx>=1.17.0",
    "onnxruntime==1.20.1",  # the version the C++ engine links (MODULE.bazel), to check exports
    "onnxscript",           # used by torch.onnx.export
    "peewee==4.5.3",        # pinned: minor versions have had breaking changes
    "protobuf>=6.33.4,<7",  # at least the protoc version in MODULE.bazel (33.4)
    "torch==2.14.1",        # the CUDA 12.6 build, from the index below
]

[dependency-groups]
dev = [
    "jupyterlab",
    "pytest",       # tools/githooks/pre-commit
    "pytest-cov",
    "ruff",         # tools/githooks/pre-commit
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The Python code lives in python/: bg/ (ours) and proto/ (generated by
# python/generate_protos.py). The editable install puts python/ on the path.
[tool.hatch.build.targets.wheel]
packages = ["python/bg", "python/proto"]

[tool.uv]
# The lock only needs to work on this machine's kind of platform; PyTorch's
# CUDA builds don't exist elsewhere anyway.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# PyTorch's CUDA 12.6 builds are the last to support the GTX 1050 Ti (Pascal,
# sm_61); CUDA 12.8+ builds don't, and 2.14 is expected to be the last release
# with a CUDA 12.6 build. "explicit": only torch comes from this index.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 120
# Generated by protoc.
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = ["UP045"]

[tool.ruff.lint.isort]
known-first-party = ["bg", "proto"]
split-on-trailing-comma = false  # matches format.skip-magic-trailing-comma

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
# Only our tests: without this pytest wanders into bazel-* and external/,
# which contain third-party test suites.
testpaths = ["python"]
norecursedirs = [".*", "bazel-*", "external", "data", "build", "dist"]
