[tool.ruff]
line-length = 120
target-version = "py311"
# Generated by protoc.
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = ["UP045"]

[tool.ruff.lint.isort]
known-first-party = ["bg", "proto"]
split-on-trailing-comma = false  # matches format.skip-magic-trailing-comma

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
# Only our tests: without this pytest wanders into bazel-* and external/,
# which contain third-party test suites.
testpaths = ["python"]
pythonpath = ["python"]
norecursedirs = [".*", "bazel-*", "external", "data", "build", "dist"]
